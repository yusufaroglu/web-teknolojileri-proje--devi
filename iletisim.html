                </ul>
            </div>
        </div>
    </nav>

    <!-- İçerik Alanı -->
    <div class="icerik-alani">
        <div class="icerik-karti">
           <div class="container mt-5">
    <div class="saydam-kart p-5 shadow-sm rounded-4 border-0">
        <h2 class="fw-bold text-center mb-4">Bana Ulaşın</h2>
        
        <form id="iletisimFormu">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Ad Soyad *</label>
                    <input type="text" id="adSoyad" class="form-control p-3" placeholder="Adınızı Giriniz">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Öğrenci No *</label>
                    <input type="text" id="ogrenciNo" class="form-control p-3" placeholder="B251234567">
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-bold">E-posta *</label>
                    <input type="email" id="eposta" class="form-control p-3" placeholder="ornek@ogr.sakarya.edu.tr">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Telefon</label>
                    <input type="tel" id="telNo" class="form-control p-3" placeholder="05XX XXX XX XX">
                </div>

                <div class="col-md-12">
                    <label class="form-label fw-bold text-primary">Yüklenecek Dosya</label>
                    <input type="file" id="dosyaSec" class="form-control p-2 bg-light">
                </div>

                <div class="col-md-12">
                    <label class="form-label fw-bold">Konu / Mesaj *</label>
                    <textarea id="mesaj" class="form-control p-3" rows="4" placeholder="Mesajınızı buraya yazın..."></textarea>
                </div>

                <div class="col-md-6">
                    <button type="button" onclick="formuJSileDogrula()" class="btn btn-success w-100 py-3 fw-bold rounded-3">
                        JS ile Doğrula
                    </button>
                </div>
                <div class="col-md-6">
                    <button type="button" class="btn btn-info w-100 py-3 fw-bold text-white rounded-3" onclick="alert('Vue.js yapısı bu ödevde simüle edilmiştir.')">
                        VUE.JS ile Doğrula
                    </button>
                </div>

                <div class="col-md-12 text-center mt-3 d-flex gap-2 justify-content-center">
                    <button type="button" class="btn btn-secondary px-5 py-2" onclick="formuGonder()">Gönder</button>
                    <button type="reset" class="btn btn-dark px-5 py-2">Temizle</button>
                </div>
            </div>
        </form>

        <div id="sonucAlani" class="mt-4 d-none alert alert-info rounded-4 shadow-sm text-center">
            </div>
    </div>
</div>

<script>
    function formuJSileDogrula() {
        const ad = document.getElementById('adSoyad').value.trim();
        const no = document.getElementById('ogrenciNo').value.trim();
        const mail = document.getElementById('eposta').value.trim();
        const dosya = document.getElementById('dosyaSec').value;

        if (ad === "" || no === "" || mail === "") {
            alert("Hata: Yıldızlı alanlar boş bırakılamaz!");
            return false;
        }
        
        alert("Başarılı: JavaScript ile doğrulama yapıldı. Dosya durumu: " + (dosya ? "Seçildi" : "Seçilmedi"));
        return true;
    }

    function formuGonder() {
        
        if(formuJSileDogrula()) {
            document.getElementById('iletisimFormu').classList.add('d-none');
            const sonuc = document.getElementById('sonucAlani');
            sonuc.classList.remove('d-none');
            sonuc.innerHTML = `<h4>Mesajınız Alındı!</h4><p>Öğrenci: ${document.getElementById('ogrenciNo').value}</p>`;
        }
    }
</script>
        </div>
    </div>

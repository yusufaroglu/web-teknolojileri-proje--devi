    <script>
        function formuJSileDogrula() {
            const ad = document.getElementById('adSoyad').value.trim();
            const no = document.getElementById('ogrenciNo').value.trim();
            const mail = document.getElementById('eposta').value.trim();
            const tel = document.getElementById('telNo').value.trim();
            const konu = document.getElementById('konu').value;
            const geridonus = document.querySelector('input[name="geridonus"]:checked');
            const onay = document.getElementById('onay').checked;

            if (ad === "" || no === "" || mail === "" || konu === "" || !geridonus || !onay) {
                alert("Vanilla JS Hata: Yıldızlı alanlar, seçim menüleri ve onay kutusu boş bırakılamaz!");
                return false;
            }

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(mail)) {
                alert("Vanilla JS Hata: Geçerli bir e-posta adresi giriniz!");
                return false;
            }

            const telRegex = /^[0-9]+$/;
            if (tel !== "" && !telRegex.test(tel)) {
                alert("Vanilla JS Hata: Telefon numarası sadece rakam olmalıdır!");
                return false;
            }
            
            alert("Vanilla JS: Tüm kontroller başarılı!");
            return true;
        }

        function formuGonder() {
            if(formuJSileDogrula()) {
                document.getElementById('iletisimFormu').submit();
            }
        }
    </script>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    form: { ad: '', no: '', mail: '', tel: '', konu: '', geridonus: '', onay: false }
                }
            },
            methods: {
                vueIleDogrula() {
                    if (!this.form.ad || !this.form.no || !this.form.mail || !this.form.konu || !this.form.geridonus || !this.form.onay) {
                        alert("Vue.js Hata: Onay kutusu ve seçimler dahil tüm yıldızlı alanları doldurmalısınız!");
                        return;
                    }
                    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    if (!emailRegex.test(this.form.mail)) {
                        alert("Vue.js Hata: E-posta formatınız hatalı!");
                        return;
                    }
                    const telRegex = /^[0-9]+$/;
                    if (this.form.tel && !telRegex.test(this.form.tel)) {
                        alert("Vue.js Hata: Telefon kutusuna sadece rakam girebilirsiniz!");
                        return;
                    }
                    alert("Vue.js: Mükemmel! Framework doğrulaması başarılı.");
                }
            }
        }).mount('#vue-app');
    </script>
